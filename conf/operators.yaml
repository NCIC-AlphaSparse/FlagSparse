ops:
  - id: gather
    description: |
      Gathers values from a dense tensor by index using the FlagSparse gather path.
    for:
      - flagsparse_gather
    labels:
      - flagsparse
      - sparse
      - triton
      - public-api
    kind:
      - Sparse
    stages:
      - beta: "1.0"

  - id: scatter
    description: |
      Scatters values into a dense tensor by index using the FlagSparse scatter path.
    for:
      - flagsparse_scatter
    labels:
      - flagsparse
      - sparse
      - triton
      - public-api
    kind:
      - Sparse
    stages:
      - beta: "1.0"

  - id: axpby
    description: |
      Computes y = alpha * x + beta * y for a sparse vector x (cusparseAxpby).
    for:
      - flagsparse_axpby
    labels:
      - flagsparse
      - sparse
      - triton
      - public-api
    kind:
      - Sparse
    stages:
      - alpha: "1.0"

  - id: spvv
    description: |
      Computes the dot product of a sparse and a dense vector (cusparseSpVV).
    for:
      - flagsparse_spvv
    labels:
      - flagsparse
      - sparse
      - triton
      - public-api
    kind:
      - Sparse
    stages:
      - alpha: "1.0"

  - id: spmv_csr
    description: |
      Computes sparse matrix-vector multiplication for a CSR matrix.
      Seven explicit algorithms support six value dtypes and non/trans/conj.
      Transpose CSR construction is performed and timed in every run.
      New dtype/op combinations require hardware validation.
    for:
      - flagsparse_spmv_csr
      - flagsparse_spmv_csr_run
      - list_spmv_csr_algorithms
      - get_spmv_csr_algorithm_spec
      - prepare_spmv_csr
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmv_coo
    description: |
      Computes sparse matrix-vector multiplication for a COO matrix.
    for:
      - flagsparse_spmv_coo
      - prepare_spmv_coo
    labels:
      - flagsparse
      - sparse
      - coo
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmv_csc
    description: |
      Computes sparse matrix-vector multiplication for a CSC matrix.
    for:
      - flagsparse_spmv_csc
      - prepare_spmv_csc
    labels:
      - flagsparse
      - sparse
      - csc
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmv_sell
    description: |
      Computes sparse matrix-vector multiplication for a sliced-ELLPACK matrix (cusparseSpMV SELL_ALG1).
    for:
      - flagsparse_spmv_sell
      - dense_to_sell
      - csr_to_sell
    labels:
      - flagsparse
      - sparse
      - sell
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - alpha: "1.0"

  - id: spmv_bsr
    description: |
      Computes sparse matrix-vector multiplication for a BSR matrix.
    for:
      - flagsparse_spmv_bsr
      - prepare_spmv_bsr
    labels:
      - flagsparse
      - sparse
      - bsr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmv_coo_tocsr
    description: |
      Computes COO SpMV through a COO-to-CSR preparation path.
    for:
      - flagsparse_spmv_coo_tocsr
      - prepare_spmv_coo_tocsr
    labels:
      - flagsparse
      - sparse
      - coo
      - csr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_csr
    description: |
      Computes sparse matrix-dense matrix multiplication for a CSR matrix.
    for:
      - flagsparse_spmm_csr
      - flagsparse_spmm_csr_run
      - prepare_spmm_csr_route
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_coo
    description: |
      Computes sparse matrix-dense matrix multiplication for a COO matrix.
    for:
      - flagsparse_spmm_coo
    labels:
      - flagsparse
      - sparse
      - coo
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_bsr
    description: |
      Computes sparse matrix-dense matrix multiplication for a BSR matrix.
    for:
      - flagsparse_spmm_bsr
      - flagsparse_spmm_bsr_run
      - prepare_spmm_bsr_route
    labels:
      - flagsparse
      - sparse
      - bsr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_bell
    description: |
      Computes sparse matrix-dense matrix multiplication for a Blocked-ELL matrix.
    for:
      - flagsparse_spmm_bell
      - flagsparse_spmm_bell_run
      - prepare_spmm_bell_route
    labels:
      - flagsparse
      - sparse
      - bell
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_csc
    description: |
      Computes sparse matrix-dense matrix multiplication for a CSC matrix.
    for:
      - flagsparse_spmm_csc
      - flagsparse_spmm_csc_run
      - prepare_spmm_csc_route
    labels:
      - flagsparse
      - sparse
      - csc
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_csr_opt
    description: |
      Computes optimized CSR sparse matrix-dense matrix multiplication.
    for:
      - flagsparse_spmm_csr_opt
      - prepare_spmm_csr_opt
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - optimized
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_csr_opt_alg1
    description: |
      Computes optimized CSR SpMM using the algorithm 1 path.
    for:
      - flagsparse_spmm_csr_opt_alg1
      - flagsparse_spmm_csr_opt_alg1_preprocess
      - prepare_spmm_csr_opt_alg1
      - prepare_spmm_csr_opt_alg1_preprocess
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - optimized
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spmm_csr_opt_alg2
    description: |
      Computes optimized CSR SpMM using the algorithm 2 path.
    for:
      - flagsparse_spmm_csr_opt_alg2
      - flagsparse_spmm_csr_opt_alg2_preprocess
      - prepare_spmm_csr_opt_alg2
      - prepare_spmm_csr_opt_alg2_preprocess
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - optimized
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: alpha_spmm_alg1
    description: |
      Computes AlphaSparse-style CSR SpMM using the algorithm 1 implementation family.
    for:
      - flagsparse_alpha_spmm_alg1
      - flagsparse_alpha_spmm_alg1_tle
      - flagsparse_alpha_spmm_alg1_tle_opt
      - prepare_alpha_spmm_alg1
      - prepare_alpha_spmm_alg1_tle
      - prepare_alpha_spmm_alg1_tle_opt
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - alpha-sparse
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spgemm_csr
    description: |
      Computes sparse matrix-sparse matrix multiplication for CSR inputs.
    for:
      - flagsparse_spgemm_csr
