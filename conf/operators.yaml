    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: sddmm_csr
    description: |
      Computes sampled dense-dense matrix multiplication on a CSR sparsity pattern.
    for:
      - flagsparse_sddmm_csr
      - prepare_sddmm_csr
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseLinearAlg
    stages:
      - beta: "1.0"

  - id: spsv_csr
    description: |
      Solves sparse triangular systems represented in CSR format.
    for:
      - flagsparse_spsv_csr
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseSolver
    stages:
      - beta: "1.0"

  - id: spsv_coo
    description: |
      Solves sparse triangular systems represented in COO format.
    for:
      - flagsparse_spsv_coo
    labels:
      - flagsparse
      - sparse
      - coo
      - triton
      - public-api
    kind:
      - SparseSolver
    stages:
      - beta: "1.0"

  - id: spsv_sell
    description: |
      Solves sparse triangular systems represented in cuSPARSE-compatible
      column-major Sliced ELLPACK format using native Triton kernels.
      NON_TRANS and TRANS/CONJ support float32/float64/complex64/complex128
      with int32/int64 indices and UNIT/NON_UNIT diagonals. ALG1 is the
      original persistent row solver and ALG2 is slice-cooperative for
      NON_TRANS, while TRANS/CONJ uses one dedicated slice-cooperative
      reverse-dependency kernel.
    for:
      - flagsparse_spsv_sell
      - flagsparse_spsv_analysis_sell
      - flagsparse_spsv_solve_sell
    labels:
      - flagsparse
      - sparse
      - sell
      - triton
      - public-api
    kind:
      - SparseSolver
    stages:
      - beta: "1.0"

  - id: spsv_descriptor_api
    description: |
      Provides descriptor, buffer-size, analysis, preprocess, and solve APIs for SpSV workflows.
    for:
      - flagsparse_create_spsv_handle
      - flagsparse_create_dnvec
      - flagsparse_create_spmat_csr
      - flagsparse_create_spmat_coo
      - flagsparse_spsv_buffer_size
      - flagsparse_spsv_buffer_size_ex
      - flagsparse_spsv_create_workspace
      - flagsparse_spsv_analysis_csr
      - flagsparse_spsv_analysis_coo
      - flagsparse_spsv_analysis_ex
      - flagsparse_spsv_preprocess_csr
      - flagsparse_spsv_preprocess_coo
      - flagsparse_spsv_solve_csr
      - flagsparse_spsv_solve_coo
      - flagsparse_spsv_solve_ex
    labels:
      - flagsparse
      - sparse
      - csr
      - coo
      - descriptor
      - public-api
    kind:
      - SparseSolver
      - Utility
    stages:
      - beta: "1.0"

  - id: spsm_csr
    description: |
      Solves sparse triangular systems with dense matrix right-hand sides in CSR format.
    for:
      - flagsparse_spsm_csr
    labels:
      - flagsparse
      - sparse
      - csr
      - triton
      - public-api
    kind:
      - SparseSolver
    stages:
      - beta: "1.0"

  - id: spsm_coo
    description: |
      Solves sparse triangular systems with dense matrix right-hand sides in COO format.
    for:
      - flagsparse_spsm_coo
    labels:
      - flagsparse
      - sparse
      - coo
      - triton
      - public-api
    kind:
      - SparseSolver
    stages:
      - beta: "1.0"

  - id: sparse_format_constructors
    description: |
      Creates sparse matrix containers and converts COO data into supported sparse formats.
    for:
      - create_csr_matrix
      - create_coo_matrix
      - create_csc_matrix
      - create_bsr_matrix
      - create_sell_matrix
      - create_blocked_ell_matrix
      - coo_to_csr
      - coo_to_csc
      - coo_to_bsr
      - coo_to_sell
      - coo_to_blocked_ell
      - generate_random_sparse_matrix
      - read_mtx_file
    labels:
      - flagsparse
      - sparse
      - format
      - public-api
    kind:
      - SparseFormat
      - Utility
    stages:
      - beta: "1.0"

# Delivery-report registrations. Python and C API summary writers both consume
# this field. Add a record here before wiring a new reportable variant.
#
# One registry, 65 variants: the original 20 (fork/list.xlsx, 2026-09-21) plus 45
# more from docs/NEW_OPERATORS_CUSPARSE_12_5.md. There is no separate `q4_variants:`
# list -- a variant's pytest cases, Python benchmark rows and C API benchmark rows
# are all found by its `id` (tests/pytest/test_q4_variants_accuracy.py, the
# `variant` CSV column, the `variant` tag capi/tools/gen_variants.py stamps).
#
# `capi: true` means the C API implements that exact (operator, dtype, opA):
# derived from capi/conf/operators.yaml's `status`/`dtypes`/`mixed_dtypes`/`ops`
# and checked both ways by tests/ci/test_delivery_variant_registry.py. All 65 are
# `true` since 2026-10-08 (the origin/q4 C API work, ported and benchmarked on
# CUDA). A variant added later that the C API cannot run yet goes in as `false`.
delivery_variants:
  - {id: gather_f16_int, operator: gather, format: sparse_vector, dtype: f16, capi: true}
  - {id: gather_f32_int, operator: gather, format: sparse_vector, dtype: f32, capi: true}
  - {id: gather_f64_int, operator: gather, format: sparse_vector, dtype: f64, capi: true}
  - {id: gather_c32_int, operator: gather, format: sparse_vector, dtype: c32, capi: true}
