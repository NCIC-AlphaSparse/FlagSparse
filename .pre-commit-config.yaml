# Vendored third-party code is not ours to reformat. Without this, the
# whitespace hooks rewrite 9 files under libtriton_jit on every run and
# `pre-commit run --all-files` can never come back clean -- CI has not noticed
# only because format-check runs first and was failing before it.
exclude: '^capi/deps/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^(tests/ci|tools/ci)/.*\.py$
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^(tests/ci|tools/ci)/.*\.py$
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        files: ^(tests/ci|tools/ci)/.*\.py$
        args:
          - --ignore=F405,E731,W503,E203,E402
          - --max-line-length=120
